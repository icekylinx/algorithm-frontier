<svg role="img" aria-labelledby="title" xmlns="http://www.w3.org/2000/svg" width="501.65" height="79.70" viewBox="-180 -2594 29508.9 4688" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="title">\begin{split}
 \sum_{j=2}^{s}\frac{\tau}{b_j}
                    [(C+2)b_{j-1}+2]
 &amp;\le 2(s-1)(s+3)\tau+
                2\tau\sum_{j=2}^{s}\frac1{b_j}\\
 &amp;&lt; [2(s-1)(s+3)+4]\tau
   =O(s^3S).
\end{split}
