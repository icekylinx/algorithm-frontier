<svg role="img" aria-labelledby="title" xmlns="http://www.w3.org/2000/svg" width="432.52" height="84.44" viewBox="-180 -2733.5 25442.2 4967.1" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="title">\begin{aligned}
 \sum_{\ell\ge1}\frac{(1-e^{-\ell t})^{-d}-1}{\ell}
 &amp;\le \sum_{i=1}^d {d\choose i}t^{-i}
                              \sum_{\ell\ge1}\ell^{-(i+1)}\\
 &amp;\le 2\bigl((1+1/t)^d-1\bigr).
 \end{aligned}
