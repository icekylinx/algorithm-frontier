<svg role="img" aria-labelledby="title" xmlns="http://www.w3.org/2000/svg" width="461.42" height="112.79" viewBox="-180 -3567.4 27142.2 6634.9" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="title">\begin{aligned}
 &amp;w_z=\binom dz\frac{(A-1)^z}{A^d},
       \qquad \sum_{z=0}^d w_z=1,\\
 &amp;\sum_{z=0}^d w_z\,
       \frac{\binom qz}{\binom dz}A^{d-z}
   =\sum_{z=0}^d\binom qz\left(\frac{A-1}{A}\right)^z
   \le(2-1/A)^q.
 \end{aligned}
