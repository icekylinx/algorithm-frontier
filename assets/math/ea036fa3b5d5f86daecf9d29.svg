<svg role="img" aria-labelledby="title" xmlns="http://www.w3.org/2000/svg" width="431.70" height="79.93" viewBox="-180 -2600.8 25393.9 4701.6" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="title">\begin{aligned}
 \left(\prod_i|\mathcal C_{n_i,p_i}|\right)
                 A^{c-\sum_i k_i}
   &amp;\le\prod_i\left[(n_i+2)
       {\binom{n_i}{k_i}\over\binom{p_i}{k_i}}A^{p_i-k_i}\right]\\
   &amp;\le(\ell+2)^m(2-1/A)^q.
 \end{aligned}
