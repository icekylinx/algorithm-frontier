<svg role="img" aria-labelledby="title" xmlns="http://www.w3.org/2000/svg" width="364.83" height="168.63" viewBox="-180 -5209.6 21460.5 9919.2" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="title">\begin{aligned}
 G-\beta\mathcal C
 &amp;\le
  \sum_d\big((1-\beta)/s_d-\pi_d\big)(h_{s_d})_+\\
 &amp;\quad+
  \sum_d\big(\pi_d-(1+\beta)/s_d\big)(-h_{s_d})_+\\
 &amp;\le
  \sum_d\big(\pi_d-(1+\beta)/s_d\big)_+(-h_{s_d})_+\\
 &amp;\le
  \sum_d\big(s_d\pi_d-1-\beta\big)_+.
\end{aligned}
