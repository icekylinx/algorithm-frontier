<svg role="img" aria-labelledby="title" xmlns="http://www.w3.org/2000/svg" width="408.90" height="101.57" viewBox="-180 -3237.5 24053 5975" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="title">\begin{aligned}
 \sum_{k=0}^p w_k(x)T_{n,p}(k)
 &amp;=\left(\frac{A}{1+x}\right)^p
       \sum_{k=0}^p\binom nk\left(\frac{x}{A}\right)^k\\
 &amp;\le\left(\frac{A}{1+x}\right)^p
       \left(1+\frac{x}{A}\right)^n.
 \end{aligned}
