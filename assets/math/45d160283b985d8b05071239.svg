 \sum_{j\in L}x'_j(p)
    &amp;=A_L-\sum_{j\in L}y'_j(p)\\
    &amp;\ge A_L-\left\lceil A_L-\sum_{j\in L}x_j(p)\right\rceil
      =\left\lfloor\sum_{j\in L}x_j(p)\right\rfloor.
 \end{aligned}
