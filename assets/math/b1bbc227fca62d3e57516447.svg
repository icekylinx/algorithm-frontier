<svg role="img" aria-labelledby="title" xmlns="http://www.w3.org/2000/svg" width="372.42" height="132.53" viewBox="-180 -4148 21907 7795.9" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="title">\begin{aligned}
\deg_L+\lambda\deg_R
&amp;\leq\sum_j\bigl(a_{ij}L_j+\lambda b_{ij}R_j\bigr)\\
&amp;=\sum_j a_{ij}\bigl(L_j+\lambda_jR_j\bigr)\\
&amp;\leq\sum_j a_{ij}F_{d-1}(\lambda_j)
=F_d(\lambda).
\end{aligned}
