 \langle u_e(x),u_e(y)\rangle
 ={}&amp;-\frac12d_e(x,y)^2
 +\frac1{2N}\sum_z d_e(x,z)^2\\
 &amp;+\frac1{2N}\sum_z d_e(y,z)^2
 -\frac1{2N^2}\sum_{z,z'}d_e(z,z')^2.
\end{aligned}
