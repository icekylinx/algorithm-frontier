<svg role="img" aria-labelledby="title" xmlns="http://www.w3.org/2000/svg" width="568.07" height="117.09" viewBox="-180 -3694.8 33415.7 6887.9" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="title">\det_{0\le i,j&lt;w}\binom{N}{k_j+i}
=
(-1)^{w(w-1)/2}
\frac{
\displaystyle\left(\prod_{s=0}^{w-1}(N+s)!\right)
\left(\prod_{0\le a&lt;b&lt;w}(k_b-k_a)\right)
}{
\displaystyle\prod_{j=0}^{w-1}(k_j+w-1)!(N-k_j)!
}.
