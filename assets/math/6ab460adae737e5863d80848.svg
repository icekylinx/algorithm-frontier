<svg role="img" aria-labelledby="title" xmlns="http://www.w3.org/2000/svg" width="664.95" height="46.90" viewBox="-180 -1629.5 39114.5 2759" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="title">\Psi_A(q,c)=2^{qf_A(\rho)},\qquad
 f_A(\rho)=
 \begin{cases}
 \rho\log_2 A,&amp;0\le\rho\le1/A,\\
 H_2(\rho)+(1-\rho)\log_2(1-1/A),&amp;1/A\le\rho&lt;1.
 \end{cases}
