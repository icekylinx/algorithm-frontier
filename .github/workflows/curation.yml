name: Curation checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate curation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate curation contract
        run: python3 tools/validate_curation.py
      - name: Check LaTeX delimiters
        run: python3 tools/check_latex_delimiters.py
      - name: Check result-card schema
        run: python3 tools/check_card_schema.py
      - name: Replay finite Subset Sum contract
        run: python3 tools/verify_subset_sum_certificates.py
      - name: Replay finite two-scenario reduction
        run: python3 tools/verify_finite_reductions.py
      - name: Check promoted rational constants
        run: python3 tools/verify_rational_certificates.py
      - name: Verify incremental source hashes
        run: python3 tools/verify_incremental_sources.py
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
      - name: Validate review registry
        run: python3 tools/validate_reviews.py
      - name: Check reviewed internal links
        run: python3 tools/check_internal_links.py
