name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_contacts:
        description: "Recompute all 62 two-level and 16 third-lookup Subset Sum branches"
        type: boolean
        required: false
        default: false
      contact_jobs:
        description: "Parallel workers for continuous contact verification"
        type: number
        required: false
        default: 2

permissions:
  contents: read

jobs:
  validate:
    name: Validate manuscripts and certificates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run canonical repository checks
        env:
          FULL_CONTACTS: ${{ github.event_name == 'workflow_dispatch' && inputs.full_contacts || false }}
          CONTACT_JOBS: ${{ inputs.contact_jobs || 2 }}
        shell: bash
        run: |
          args=(--jobs "$CONTACT_JOBS")
          if [[ "$FULL_CONTACTS" == "true" ]]; then
            args+=(--full-contacts)
          fi
          python3 tools/check_repository.py "${args[@]}"
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
